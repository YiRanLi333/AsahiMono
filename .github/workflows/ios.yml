name: ios

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # 4.5.2 is the last Godot release whose iOS template still uses the ObjC++
  # entry point. 4.6+ switched the template to Swift + SwiftUI (visionOS rework)
  # and strongly links SwiftUICore.framework, which does not exist before iOS 18;
  # the test device runs iOS 15.3.1 and dies in dyld with
  #   Library not loaded: /System/Library/Frameworks/SwiftUICore.framework/SwiftUICore
  # Keep the editor, the export templates and Godot.NET.Sdk in lockstep.
  GODOT_VERSION: 4.5.2
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  unsigned-ipa:
    name: Export unsigned iOS .ipa
    # macos-15 = macOS 15.8.2 + Xcode 16.4 (iPhoneOS18.5 SDK) by default, which is the
    # SDK generation Godot 4.5.2's prebuilt libgodot.ios.a was built against.
    # (While this job still used Godot 4.7.2 it had to run on macos-26, because that
    # template is built against the iOS 26 SDK and died at link time on macos-15 with
    # `ld: Undefined symbols: _MTLTensorDomain, _CADynamicRange*`. That reason is gone
    # with the downgrade, so prefer the older, better-matching toolchain.)
    runs-on: macos-15
    timeout-minutes: 60

    # Needed so the failure path can push the build logs to the ci-logs branch
    # (GitHub's job-log API is not readable without a token from our side).
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show toolchain versions
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          dotnet --version

      - name: Architecture guard (Game.Core must stay engine-free)
        run: |
          # T-0001 guard. The literal one-liner `! grep -qi godot Game.Core/Game.Core.csproj`
          # is NOT enough: bash `set -e` ignores the exit status of a command whose result
          # is inverted with `!`, so a real match would not fail the step. The if-block
          # below is what actually enforces it.
          if grep -qi godot Game.Core/Game.Core.csproj; then
            echo "::error file=Game.Core/Game.Core.csproj::Godot reference found - architecture breach"
            exit 1
          fi
          echo "guard ok: Game.Core.csproj has no Godot reference"

      - name: dotnet test
        run: |
          dotnet --info
          dotnet test Game.Core.Tests/Game.Core.Tests.csproj --nologo

      - name: Verify mobile texture compression setting
        run: |
          set -euo pipefail
          # iOS export refuses to run unless ETC2/ASTC import is on, and it fails
          # WITHOUT printing any reason (editor_export_platform_apple_embedded.cpp:2293).
          grep -q '^textures/vram_compression/import_etc2_astc=true$' project.godot
          echo "etc2/astc import: enabled"

      - name: Download Godot ${GODOT_VERSION} .NET (mono) editor for macOS
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o godot_mono_macos.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          unzip -q godot_mono_macos.zip -d godot_editor
          APP="$(find godot_editor -maxdepth 2 -name '*.app' -print -quit)"
          echo "godot app: $APP"
          chmod +x "$APP/Contents/MacOS/Godot"
          xattr -dr com.apple.quarantine "$APP" || true
          echo "GODOT_BIN=$APP/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          "$APP/Contents/MacOS/Godot" --version

      - name: Download and install export templates
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mkdir -p templates_extract
          unzip -q templates.tpz -d templates_extract
          TPL_VER="$(cat templates_extract/templates/version.txt)"
          echo "template version: $TPL_VER"
          DEST="$HOME/Library/Application Support/Godot/export_templates/$TPL_VER"
          mkdir -p "$DEST"
          cp -R templates_extract/templates/. "$DEST/"
          ls -la "$DEST"
          test -f "$DEST/ios.zip"

      - name: Import resources
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import 2>&1 | tee import.log

      - name: Build C# solution (Debug + ExportRelease)
        run: |
          set -euo pipefail
          # Godot's C# export packages an existing assembly; it does not build the
          # game csproj for you. `dotnet test` above only builds Game.Core.Tests.
          # Debug is what the headless editor loads at startup (otherwise it logs
          # ".NET: Failed to load project assembly"); ExportRelease is what the
          # exporter packages.
          dotnet build AsahiMono.csproj -c Debug --nologo 2>&1 | tee build.log
          dotnet build AsahiMono.csproj -c ExportRelease --nologo 2>&1 | tee -a build.log

      - name: Export Xcode project
        run: |
          set -euo pipefail
          mkdir -p build/ios
          # export_project_only=true in export_presets.cfg: Godot writes the
          # Xcode project and does not attempt to code sign anything.
          "$GODOT_BIN" --headless --path . --verbose --export-release "iOS" build/ios/App.xcodeproj 2>&1 | tee export.log
          ls -la build/ios

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          {
            xcodebuild -project build/ios/App.xcodeproj -list
            SCHEME="$(xcodebuild -project build/ios/App.xcodeproj -list -json \
              | /usr/bin/python3 -c 'import json,sys; p=json.load(sys.stdin)["project"]; s=(p.get("schemes") or p.get("targets")); print(s[0])')"
            echo "archiving scheme: $SCHEME"
            xcodebuild -project build/ios/App.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/ios/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              EXPANDED_CODE_SIGN_IDENTITY=""
          } 2>&1 | tee xcodebuild.log

      - name: Package Payload into App.ipa
        run: |
          set -euo pipefail
          APP="$(find build/ios/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          echo "app bundle: $APP"
          test -n "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../App.ipa Payload)
          ls -la build/App.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsahiMono-unsigned-ipa
          path: build/App.ipa
          if-no-files-found: error

      # ---- diagnostics channel ------------------------------------------------
      # The job-log API needs a token we do not hold, and pushing to a side branch
      # needs a writable GITHUB_TOKEN (this repo's default is read-only). What IS
      # publicly readable without any token is the check-runs annotations endpoint:
      #   GET /repos/{owner}/{repo}/check-runs/{job_id}/annotations
      # So on failure we surface the interesting log lines as annotations, and put
      # the full log on a keyless paste whose URL we also annotate.
      - name: Surface failure details as annotations
        if: failure()
        run: |
          set -uo pipefail
          # GitHub caps annotations per step, so keep it short and specific.
          if [ -f export.log ]; then
            grep -n -i -E 'error|cannot|fail|fatal|missing|denied|no such|unable' export.log \
              | tail -n 6 \
              | while IFS= read -r line; do
                  esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')
                  echo "::error file=export.log::$esc"
                done
          fi
          for f in export.log build.log import.log xcodebuild.log; do
            [ -f "$f" ] || continue
            url=$(curl -sS -m 30 --data-binary "@$f" https://paste.rs 2>/dev/null || true)
            if [ -n "${url:-}" ]; then
              echo "::error file=$f::FULL $f -> $url"
            fi
          done

      # Optional mirror: needs a writable GITHUB_TOKEN, so never let it mask the
      # real failure above. Publicly readable at
      #   https://raw.githubusercontent.com/<owner>/<repo>/ci-logs/<file>.log
      - name: Publish CI logs to ci-logs branch
        if: failure()
        continue-on-error: true
        run: |
          set -e
          rm -rf ci-logs
          mkdir -p ci-logs
          for f in import.log export.log xcodebuild.log; do
            [ -f "$f" ] && cp "$f" "ci-logs/$f" || true
          done
          printf 'run=%s\nattempt=%s\nsha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > ci-logs/META.txt
          cd ci-logs
          git init -q -b ci-logs
          git config user.email ci@yiranli.cc
          git config user.name "AsahiMono CI"
          git add -A
          git commit -q -m "ci logs run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
